name: Keep MongoDB Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://resume-ai-pro.vercel.app/api/health)
          echo "Health check responded with status: $response"
          if [ "$response" -ne 200 ]; then
            exit 1
          fi
